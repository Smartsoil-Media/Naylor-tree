[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: send every unknown path to index.html so React Router
# can handle deep links like /people/lydia-naylor-1892 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
